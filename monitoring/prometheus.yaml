global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'probity'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9091']  # management port; use app:9091 in Compose
    # If running with prod profile, replace with:
    # static_configs:
    #   - targets: ['app:9091']

  - job_name: 'probity-worker'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['simulation-worker:8081']  # use host.docker.internal:8081 if running worker on host
    # If running with worker profile under compose, Prometheus and worker share the compose network.
