name: CI/CD

on:
  push:
    branches: [ master, develop ]
  # No base-branch restriction on pull_request: stacked PRs (a feature branch
  # based on another unmerged branch) must also run CI.
  pull_request:
  schedule:
    - cron: '32 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.push.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend || steps.push.outputs.frontend }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Filter paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            backend:
              - 'probity-api/**'
              - 'probity-worker/**'
              - 'probity-shared/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'Dockerfile.worker'
              - '.dockerignore'
              - 'k8s/**'
              - 'loadtest/**'
              - '.github/workflows/ci_cd.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci_cd.yaml'

      - name: Mark all components changed on push
        if: github.event_name == 'push'
        id: push
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Run on pushes (as before) and on PRs that touch backend inputs; skip on
    # docs-only and frontend-only PRs.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true')
    needs: [changes]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn verify -B
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jacoco-coverage-reports
          path: |
            probity-api/target/site/jacoco/jacoco.xml
            probity-worker/target/site/jacoco/jacoco.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: probity-api/target/surefire-reports/

  frontend_test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: [changes]
    # Run on pushes and on PRs that touch frontend inputs.
    # Skip on docs-only and backend-only PRs.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true')

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: 8.30.1

  semgrep:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run Semgrep security rules
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/src"
          --workdir /src
          semgrep/semgrep@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
          semgrep scan --config p/security-audit --error --metrics=off
          probity-api/src probity-shared/src probity-worker/src frontend/src

  build-and-push:
    name: Build, Scan & Publish Docker Images
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) || (github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' && needs.test.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: probity:${{ github.sha }}

      - name: Build worker image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.worker
          load: true
          tags: probity-worker:${{ github.sha }}

      - name: Generate API image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: probity:${{ github.sha }}
          format: cyclonedx
          output: sbom-api.cdx.json
          version: v0.74.0

      - name: Generate worker image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: probity-worker:${{ github.sha }}
          format: cyclonedx
          output: sbom-worker.cdx.json
          version: v0.74.0

      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: probity:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.74.0
          exit-code: '1'

      - name: Scan worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: probity-worker:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          version: v0.74.0
          exit-code: '1'

      - name: Upload CycloneDX SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-sboms-${{ github.sha }}
          path: sbom-*.cdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Publish scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag "probity:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/probity:${{ github.sha }}"
          docker tag "probity:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/probity:latest"
          docker tag "probity-worker:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/probity-worker:${{ github.sha }}"
          docker tag "probity-worker:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/probity-worker:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/probity:${{ github.sha }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/probity:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/probity-worker:${{ github.sha }}"
          docker push "${{ secrets.DOCKER_USERNAME }}/probity-worker:latest"

  # The single check branch protection should require.
  # Always reports on PRs: passes when the backend job was skipped (docs/frontend-only PR) or green.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, test, frontend_test, dependency-review, gitleaks, semgrep, build-and-push]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Evaluate required jobs
        run: |
          echo "backend result: ${{ needs.test.result }}"
          echo "frontend result: ${{ needs.frontend_test.result }}"
          echo "dependency review result: ${{ needs.dependency-review.result }}"
          echo "secret scan result: ${{ needs.gitleaks.result }}"
          echo "SAST result: ${{ needs.semgrep.result }}"
          echo "container build and scan result: ${{ needs.build-and-push.result }}"
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test.result }}" = "cancelled" ] || [ "${{ needs.frontend_test.result }}" = "failure" ] || [ "${{ needs.frontend_test.result }}" = "cancelled" ] || [ "${{ needs.dependency-review.result }}" = "failure" ] || [ "${{ needs.dependency-review.result }}" = "cancelled" ] || [ "${{ needs.gitleaks.result }}" = "failure" ] || [ "${{ needs.gitleaks.result }}" = "cancelled" ] || [ "${{ needs.semgrep.result }}" = "failure" ] || [ "${{ needs.semgrep.result }}" = "cancelled" ] || [ "${{ needs.build-and-push.result }}" = "failure" ] || [ "${{ needs.build-and-push.result }}" = "cancelled" ]; then
            echo "Build, test, or security check failed."
            exit 1
          fi
          echo "Required checks OK (skipped or successful)."
