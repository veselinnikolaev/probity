name: CI/CD

on:
  push:
    branches: [ master, develop ]
  # No base-branch restriction on pull_request: stacked PRs (a feature branch
  # based on another unmerged branch) must also run CI.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.push.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend || steps.push.outputs.frontend }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5

      - name: Filter paths
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'probity-api/**'
              - 'probity-worker/**'
              - 'probity-shared/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'Dockerfile.worker'
              - '.dockerignore'
              - 'k8s/**'
              - 'loadtest/**'
              - '.github/workflows/ci_cd.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci_cd.yaml'

      - name: Mark all components changed on push
        if: github.event_name == 'push'
        id: push
        run: |
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Run on pushes (as before) and on PRs that touch backend inputs; skip on
    # docs-only and frontend-only PRs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    needs: [changes]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn verify -B
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: probity-api/target/surefire-reports/

  frontend_test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: [changes]
    # Run on pushes and on PRs that touch frontend inputs.
    # Skip on docs-only and backend-only PRs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/probity:latest

  # The single check branch protection should require.
  # Always reports on PRs: passes when the backend job was skipped (docs/frontend-only PR) or green.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [changes, test, frontend_test]
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Evaluate required jobs
        run: |
          echo "backend result: ${{ needs.test.result }}"
          echo "frontend result: ${{ needs.frontend_test.result }}"
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.test.result }}" = "cancelled" ] || [ "${{ needs.frontend_test.result }}" = "failure" ] || [ "${{ needs.frontend_test.result }}" = "cancelled" ]; then
            echo "Backend or frontend build/test failed."
            exit 1
          fi
          echo "Required checks OK (skipped or successful)."