# Probity simulation worker — Service (Phase 4 §2.6).
#
# ClusterIP only: the worker has no business API and must not be reachable from
# outside the cluster. The single port exposes the actuator/metrics endpoint
# (:8081) so a Prometheus scrape job (or another in-cluster client) can reach the
# health/prometheus endpoints. No host port, no Ingress, no LoadBalancer.
#
# Note: liveness/readiness probes hit the pod directly and do not need this Service.
apiVersion: v1
kind: Service
metadata:
  name: probity-simulation-worker
  labels:
    app.kubernetes.io/name: probity-simulation-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: probity
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: probity-simulation-worker
  ports:
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
