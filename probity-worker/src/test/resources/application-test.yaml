spring:
  docker:
    compose:
      enabled: false

  # Testcontainers PostgreSQL connection details matching the Docker container
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
    url: jdbc:postgresql://localhost:5432/probity_test
    username: test
    password: test

  # Disable web server for test context to avoid WebFlux/WebClient auto-configuration failures
  main:
    web-application-type: none

  # Exclude auto-configurations that don't work in test environment
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.cache.CacheAutoConfiguration

  # Disable Hibernate schema validation / auto-DDL - schema is managed by Flyway migrations
  # But still enable EntityManagerFactory bean creation so JPA repositories can be resolved
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:/test/resources/db/migration
    validate-on-migrate: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

probity:
  kafka:
    simulation-topic-partitions: 1
  outbox:
    publish-batch-size: 10
    initial-backoff-ms: 5000
    max-backoff-ms: 300000
    poll-interval-ms: 3600000
    initial-delay-ms: 3600000
    max-error-count: 5
  reconciliation:
    enabled: false
    sweep-interval-ms: 3600000
    initial-delay-ms: 3600000