spring:
  docker:
    compose:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
    url: jdbc:tc:postgresql:16:///probity
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      username: default
      password:
  kafka:
    # Default OFF for the whole test profile: the 300+ existing tests must not
    # attach a consumer to any broker. Only the async slice
    # (me.veselin.probity.simulation.async) flips this to true via
    # @DynamicPropertySource, against its own Testcontainers broker.
    listener:
      auto-startup: false

probity:
  jwt:
    secret: J7d3kK29a91Lx8m4P2sQ6tUvWxYzA1B3C5D7E9F0G2H4I6J8K
  app:
    base-url: http://localhost:8080
  kafka:
    # The async slice historically assumed a single-partition topic. Keep that here so the
    # existing classes are unaffected by the PR-D0 production default of 6; the new
    # per-partition tests opt into 2 partitions explicitly via @DynamicPropertySource.
    simulation-topic-partitions: 1

sendgrid:
  api-key: test-key
  from-email: test@probity.com

logging:
  level:
    org.springframework.data.redis: WARN
    io.lettuce.core: WARN
    io.lettuce.core.protocol: WARN
    org.springframework.context.annotation: DEBUG
    # Consumes a few thousand lines; needed to see the listener container's
    # consumer/fetcher activity (e.g. whether the ErrorHandlingDeserializer
    # chain is what actually deserialises records in the async slice).
    org.springframework.kafka: DEBUG